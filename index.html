<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TechProt - Plataforma de Estudos em Sistemas Elétricos de Potência</title>
    <meta name="description" content="TechProt - Plataforma Web completa de estudos em sistemas elétricos de potência. Simulação de Fluxo de Carga com OLTC, Curto-Circuito, Harmônicos, Estabilidade e diagrama CAD unifilar interativo.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Application Styles -->
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
    <!-- Top Menu Bar Navigation -->
    <nav class="main-nav" id="mainNav"></nav>

    <!-- Tabbed Toolbar (Ribbon) with Arquivo, Ferramentas, Simulação -->
    <div class="tabbed-toolbar" id="tabbedToolbar"></div>

    <!-- Workspace and CAD Canvas -->
    <div class="workspace-container">
        <canvas id="cadCanvas"></canvas>

        <!-- Floating Elements Toolbar -->
        <div class="floating-toolbar" id="floatingToolbar"></div>
    </div>

    <!-- Right-click Context Menu -->
    <div class="context-menu" id="contextMenu"></div>

    <!-- Notification Toasts -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Main Module Application Script -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
