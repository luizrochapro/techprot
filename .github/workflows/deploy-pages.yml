name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate config.js
        run: |
          URL="${{ vars.CONVEX_URL }}"
          if [ -z "$URL" ]; then URL="${{ secrets.CONVEX_URL }}"; fi
          if [ -z "$URL" ]; then URL="https://scintillating-lapwing-364.convex.cloud"; fi
          printf 'window.TECHPROT_CONVEX_URL=%s;' "$(printf '%s' "$URL" | jq -R -s .)" > config.js
          cat config.js
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp config.js _site/
          [ -d css ] && cp -r css _site/
          [ -d js ] && cp -r js _site/
          [ -d assets ] && cp -r assets _site/
          touch _site/.nojekyll
          ls -R _site | head -n 100
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
